name: Publish production GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Synchronize production files
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='pr-preview/' \
            source/ pages/
          touch pages/.nojekyll

      - name: Publish production site
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Production Pages content is already current."
            exit 0
          fi

          git commit -m "Publish production Pages from main"

          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "Could not publish production Pages after three attempts." >&2
          exit 1
