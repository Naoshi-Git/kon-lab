name: Publish CryoARM manual

on:
  push:
    branches: [main]
    paths:
      - 'cryoarm-manual/manual.md'
      - 'cryoarm-manual/build.py'
      - 'cryoarm-manual/requirements.txt'
      - '.github/workflows/publish-cryoarm-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cryoarm-manual
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install -r cryoarm-manual/requirements.txt

      - name: Build HTML from canonical Markdown
        run: python cryoarm-manual/build.py

      - name: Validate output
        run: |
          test -s dist/cryoarm-manual/index.html
          grep -q 'CryoARM 撮影一気通貫マニュアル' dist/cryoarm-manual/index.html
          grep -q 'Markdown is canonical' dist/cryoarm-manual/index.html

      - name: Update only CryoARM directory on gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git branch -f gh-pages origin/gh-pages
          rm -rf /tmp/konlab-gh-pages
          git worktree add /tmp/konlab-gh-pages gh-pages

          rm -rf /tmp/konlab-gh-pages/cryoarm-manual
          mkdir -p /tmp/konlab-gh-pages/cryoarm-manual
          cp -a dist/cryoarm-manual/. /tmp/konlab-gh-pages/cryoarm-manual/

          cd /tmp/konlab-gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cryoarm-manual

          if git diff --cached --quiet; then
            echo 'No published changes.'
            exit 0
          fi

          git commit -m "docs: publish CryoARM manual ${GITHUB_SHA::7}"
          git push origin gh-pages
